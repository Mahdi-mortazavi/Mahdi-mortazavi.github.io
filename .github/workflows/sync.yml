# Keeps the site's numbers, growth curve and release timeline in sync with
# GitHub, then rebuilds the generated pages and sitemap.
name: 🔄 Sync with GitHub

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: ['sync.mjs', 'build.mjs', 'projects.json', '.github/workflows/sync.yml']
  workflow_dispatch:

concurrency:
  group: hub-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: 🔄 Pull live data from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a personal token with public-repo read unlocks real star
          # history. Without it the growth curve builds from daily snapshots.
          STARS_TOKEN: ${{ secrets.STARS_TOKEN }}
        run: node sync.mjs

      - name: 🏗️ Rebuild generated pages
        run: node build.mjs

      - name: 🚀 Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          STAGE="data.json history.json p timeline sitemap.xml robots.txt"
          git add $STAGE
          if git diff --cached --quiet; then
            echo "No changes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          MSG="🔄 Sync with GitHub — $(TZ=Asia/Tehran date +'%Y-%m-%d %H:%M') Tehran"
          git commit -m "$MSG"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "push rejected — replaying our snapshot on top of latest main"
            git fetch origin main
            # These files are a freshly generated snapshot, so ours wins wholesale;
            # merging two runs' timestamps would only ever conflict.
            git reset --soft origin/main
            git add $STAGE
            if git diff --cached --quiet; then
              echo "Another run already published this."
              echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git commit -m "$MSG"
          done
          echo "::error::could not push after 3 attempts"; exit 1

      - name: 📣 Ping IndexNow (Bing · Yandex · DuckDuckGo · Seznam)
        if: steps.commit.outputs.changed == 'true'
        run: node ping-indexnow.mjs
