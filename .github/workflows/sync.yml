# Keeps the site's numbers, growth curve and release timeline in sync with
# GitHub, then rebuilds the generated pages and sitemap.
name: 🔄 Sync with GitHub

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: ['sync.mjs', 'build.mjs', 'projects.json', '.github/workflows/sync.yml']
  workflow_dispatch:

concurrency:
  group: hub-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: 🔄 Pull live data from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node sync.mjs

      - name: 🏗️ Rebuild generated pages
        run: node build.mjs

      - name: 🚀 Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json p timeline sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "🔄 Sync with GitHub — $(TZ=Asia/Tehran date +'%Y-%m-%d %H:%M') Tehran"
          # A scheduled run and a dispatch can overlap; rebase onto whatever
          # landed first rather than failing on a stale ref.
          for attempt in 1 2 3; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push rejected — rebasing and retrying"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "::error::could not push after 3 attempts"; exit 1
