# Publishes one bilingual post a day from public, attribution-friendly sources
# (Hacker News + GitHub), rebuilds the blog and sitemap, and tells IndexNow.
name: 📰 Daily content

on:
  schedule:
    - cron: "35 5 * * *"    # 09:05 Tehran
  workflow_dispatch:

concurrency:
  group: daily-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: 🔎 Gather today's picks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: with this set, Claude writes original bilingual
          # commentary. Without it the post ships as a factual digest.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTENT_MODEL: ${{ vars.CONTENT_MODEL }}
        run: node digest.mjs

      - name: 📝 Build the blog
        run: node blog.mjs

      - name: 🗺️ Rebuild sitemap and generated pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build.mjs

      - name: 🚀 Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          STAGE="content blog sitemap.xml robots.txt p timeline"
          git add $STAGE
          if git diff --cached --quiet; then
            echo "Nothing new today."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          MSG="📰 Daily content — $(TZ=Asia/Tehran date +'%Y-%m-%d') Tehran"
          git commit -m "$MSG"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "push rejected — replaying on top of latest main"
            git fetch origin main
            git reset --soft origin/main
            git add $STAGE
            if git diff --cached --quiet; then
              echo "Another run already published this."
              echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git commit -m "$MSG"
          done
          echo "::error::could not push after 3 attempts"; exit 1

      - name: 📣 Ping IndexNow
        if: steps.commit.outputs.changed == 'true'
        run: node ping-indexnow.mjs
